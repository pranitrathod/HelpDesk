helpdesk:
  payments:
    razorpay:
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
    juspay:
      base-url: ${JUSPAY_BASE_URL:https://api.juspay.in}
      merchant-id: ${JUSPAY_MERCHANT_ID:}
      api-key: ${JUSPAY_API_KEY:}
spring:
  application:
    name: helpdesk-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/helpdesk}
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
