services:
  db:
    image: mysql:8.4
    container_name: helpdesk-db
    environment:
      MYSQL_DATABASE: helpdesk_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - helpdesk-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: helpdesk-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/helpdesk_db
      DB_USERNAME: root
      DB_PASSWORD: root
      DDL_AUTO: update
      JWT_SECRET: change-this-to-a-long-random-secret-in-real-environments
    ports:
      - "8080:8080"

volumes:
  helpdesk-db-data:
