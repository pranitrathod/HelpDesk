services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: helpdesk_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-helpdesk}
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://db:3306/helpdesk_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      DDL_AUTO: update
