spring.application.name=helpdesk
spring.datasource.url=${DB_URL:jdbc:h2:mem:helpdesk}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jackson.serialization.write-dates-as-timestamps=false
jwt.secret=${JWT_SECRET:development-secret-must-be-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}
demo.admin.password=${DEMO_ADMIN_PASSWORD:}
demo.agent.password=${DEMO_AGENT_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
