spring.application.name=helpdesk

# Database configuration - use environment variables in every environment
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/helpdesk_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT configuration - never commit secrets
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator / deployment support
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
