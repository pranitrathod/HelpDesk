name: Product Support Platform CI
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "product-support-platform/**"
      - ".github/workflows/product-support-platform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "product-support-platform/**"
      - ".github/workflows/product-support-platform-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "product-support-platform/**/pom.xml"
      - name: Build and test platform
        run: mvn -U -B -f product-support-platform/pom.xml clean verify
